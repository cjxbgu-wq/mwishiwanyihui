name: iOS Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
          fetch-depth: 0

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Diagnose repo layout
        run: |
          echo "===== pwd ====="
          pwd
          echo "===== ls root ====="
          ls -la
          echo "===== find xcode project ====="
          find . -maxdepth 4 \( -name "*.xcodeproj" -o -name "*.xcworkspace" -o -name "Package.swift" \) -not -path "./.git/*" || true
          echo "===== git tracked xcode files ====="
          git ls-files | grep -E "\.(xcodeproj|xcworkspace|pbxproj)$" | head -20 || echo "(none)"
          echo "===== .gitignore xcode rules ====="
          grep -iE "xcode|pbxproj|xcworkspace|xcuserdata" .gitignore 2>/dev/null || echo "(no .gitignore or no xcode rules)"
          echo "===== gitmodules ====="
          cat .gitmodules 2>/dev/null || echo "(no submodules)"
          echo "===== git lfs ====="
          git lfs ls-files 2>/dev/null || echo "(no lfs)"

      - name: Find project
        id: findproj
        run: |
          PROJ=$(find . -maxdepth 4 -name "*.xcworkspace" -not -path "./.git/*" | head -1)
          if [ -z "$PROJ" ]; then
            PROJ=$(find . -maxdepth 4 -name "*.xcodeproj" -not -path "./.git/*" | head -1)
          fi
          if [ -z "$PROJ" ]; then
            echo "!! 未找到任何 Xcode 工程文件" >&2
            echo "!! 请检查上方 Diagnose 输出" >&2
            exit 1
          fi
          DIR=$(dirname "$PROJ")
          echo "project=$PROJ"
          echo "dir=$DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "project=$PROJ" >> "$GITHUB_OUTPUT"

      - name: List schemes
        working-directory: ${{ steps.findproj.outputs.dir }}
        run: |
          xcodebuild -list -json | tee /tmp/schemes.json
          echo "===== schemes ====="
          cat /tmp/schemes.json

      - name: Install dependencies (CocoaPods if any)
        working-directory: ${{ steps.findproj.outputs.dir }}
        run: |
          if [ -f Podfile ]; then
            sudo gem install cocoapods --no-document
            pod install --repo-update
          fi

      - name: Build
        working-directory: ${{ steps.findproj.outputs.dir }}
        run: |
          # 自动取第一个 scheme
          SCHEME=$(python3 -c "import json,sys; d=json.load(open('/tmp/schemes.json')); print((d.get('workspace')
